<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>AI 퍼스널컬러 진단실</title>
<style>
:root{
  --bg1:#fff6f1;--bg2:#fde4ea;--ink:#3b2a33;--sub:#7d6470;--rose:#d9668a;--rose2:#b84a70;
  --gold:#c99a5b;--card:#ffffff;--line:#f1d9e0;--ok:#2fb47c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(160deg,var(--bg1),var(--bg2));
  font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);
  user-select:none;-webkit-user-select:none;touch-action:manipulation;word-break:keep-all}
button{font-family:inherit;color:inherit;border:0;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column;font-size:clamp(14px,1.9vmin,22px)}
#top{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:.5em .9em;gap:.6em}
#top .brand{font-weight:800;letter-spacing:.02em;color:var(--rose2);font-size:1.15em}
.tbtn{background:#fff;border:2px solid var(--line);border-radius:999px;padding:.45em 1em;font-weight:700;font-size:.95em;box-shadow:0 2px 6px rgba(184,74,112,.12)}
.tbtn:active{transform:scale(.96)}
.screen{flex:1 1 auto;min-height:0;display:none}
.screen.on{display:flex}

/* ---------- 시작 화면 ---------- */
#start{flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1em;position:relative;overflow:hidden}
.float{position:absolute;border-radius:50%;opacity:.55;filter:blur(1px);animation:fl 9s ease-in-out infinite alternate}
@keyframes fl{from{transform:translateY(0) scale(1)}to{transform:translateY(-6vh) scale(1.12)}}
#start h1{font-size:clamp(34px,7vmin,84px);margin:.1em 0 .15em;color:var(--rose2);letter-spacing:-.02em;position:relative}
#start h1 small{display:block;font-size:.34em;color:var(--gold);letter-spacing:.3em;font-weight:800;margin-bottom:.4em}
#start p.lead{font-size:1.35em;margin:.2em 0 1em;color:var(--ink);line-height:1.5;position:relative}
.how{display:flex;gap:1em;justify-content:center;flex-wrap:wrap;margin-bottom:1.4em;position:relative}
.how div{background:#fff;border-radius:1.2em;padding:.9em 1.1em;width:11.5em;box-shadow:0 6px 18px rgba(184,74,112,.13);line-height:1.4}
.how b{display:block;font-size:2em}
.how span{font-weight:800;color:var(--rose2)}
.how i{font-style:normal;display:block;font-size:.88em;color:var(--sub)}
#goBtn{position:relative;font-size:1.7em;font-weight:900;color:#fff;background:linear-gradient(135deg,#f08aa9,#c54f7b);
  padding:.7em 2em;border-radius:999px;box-shadow:0 10px 26px rgba(197,79,123,.4);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.priv{margin-top:1.2em;font-size:.95em;color:var(--sub);position:relative}
.credit{position:absolute;bottom:.7em;left:0;right:0;font-size:.85em;color:#a98a97}

/* ---------- 진단 화면 ---------- */
#work{gap:1em;padding:0 1em 1em;align-items:stretch}
#mirrorWrap{flex:0 0 auto;height:100%;aspect-ratio:3/4;position:relative;border-radius:1.8em;overflow:hidden;
  box-shadow:0 0 0 .35em #fff,0 0 0 .55em var(--gold),0 14px 34px rgba(120,60,80,.3);margin:.55em;height:calc(100% - 1.1em)}
#mirror{width:100%;height:100%;display:block;background:#e9d7dd}
#mirrorTag{position:absolute;left:50%;bottom:.7em;transform:translateX(-50%);background:rgba(255,255,255,.92);border-radius:999px;
  padding:.35em 1.1em;font-weight:800;font-size:1.05em;white-space:nowrap;display:none;box-shadow:0 3px 10px rgba(0,0,0,.18)}
#side{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:.7em;padding:.55em 0}
#steps{display:flex;gap:.4em;flex:0 0 auto}
#steps span{flex:1;text-align:center;font-size:.85em;font-weight:800;color:#c7aab5;border-bottom:.3em solid #f0d5dd;padding-bottom:.25em}
#steps span.on{color:var(--rose2);border-color:var(--rose)}
#steps span.done{color:var(--ok);border-color:#9fdcc0}
#coach{display:flex;gap:.7em;align-items:flex-start;flex:0 0 auto}
#coach .ava{flex:0 0 auto;width:4.6em;height:4.6em}
#coach .ava svg{width:100%;height:100%}
.bubble{flex:1;background:#fff;border-radius:1.2em;border-top-left-radius:.3em;padding:.8em 1em;font-size:1.18em;line-height:1.5;
  box-shadow:0 5px 16px rgba(184,74,112,.14);font-weight:600;min-height:3.6em}
.bubble b{color:var(--rose2)}
.bubble .nm{display:block;font-size:.72em;color:var(--gold);font-weight:800;margin-bottom:.15em}
#pane{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:.2em .3em 1em;scrollbar-width:thin}
.card{background:var(--card);border-radius:1.1em;padding:.9em 1em;box-shadow:0 4px 14px rgba(184,74,112,.1);margin-bottom:.8em}
.card h3{margin:0 0 .5em;font-size:1.08em;color:var(--rose2)}
.big{display:block;width:100%;font-size:1.3em;font-weight:900;color:#fff;background:linear-gradient(135deg,#f08aa9,#c54f7b);
  padding:.75em 1em;border-radius:1em;box-shadow:0 6px 16px rgba(197,79,123,.3);margin-top:.6em}
.big:active,.pick:active,.opt:active,.chip:active{transform:scale(.97)}
.big.ghost{background:#fff;color:var(--rose2);border:2px solid var(--line);box-shadow:none}
.tips{margin:0;padding-left:1.2em;line-height:1.7}
.tips li::marker{color:var(--rose)}

/* 분석 */
.swrow{display:flex;gap:.8em;flex-wrap:wrap}
.sw{display:flex;align-items:center;gap:.6em;opacity:0;transform:translateY(8px);transition:.5s}
.sw.in{opacity:1;transform:none}
.sw i{width:3em;height:3em;border-radius:50%;box-shadow:inset 0 0 0 3px #fff,0 2px 8px rgba(0,0,0,.2);display:block}
.sw b{display:block}.sw small{color:var(--sub)}
.gauge{margin:.55em 0}
.gauge .lab{display:flex;justify-content:space-between;font-weight:800;font-size:.92em}
.gauge .bar{height:.9em;border-radius:999px;position:relative;margin-top:.25em}
.gauge .bar em{position:absolute;top:50%;width:1.5em;height:1.5em;border-radius:50%;background:#fff;border:.28em solid var(--ink);
  transform:translate(-50%,-50%);left:50%;transition:left 1s cubic-bezier(.2,.9,.3,1.2)}
.g-t .bar{background:linear-gradient(90deg,#7fb2ff,#e9e2f5,#ffb46b)}
.g-v .bar{background:linear-gradient(90deg,#3a2c33,#b79c9c,#fff3ea)}
.g-c .bar{background:linear-gradient(90deg,#c9bfc4,#f3a3b9,#ff2e7a)}

/* 드레이핑 */
.rtitle{font-weight:900;font-size:1.15em;margin:.1em 0 .5em}
.rtitle small{color:var(--gold);margin-right:.5em}
.picks{display:flex;gap:.7em}
.pick{flex:1;background:#fff;border:.25em solid transparent;border-radius:1.1em;padding:.7em .5em;text-align:center;box-shadow:0 4px 12px rgba(184,74,112,.12)}
.pick.sel{border-color:var(--rose);box-shadow:0 6px 18px rgba(197,79,123,.3)}
.pick .dot{width:4.2em;height:4.2em;border-radius:50%;margin:0 auto .4em;box-shadow:inset 0 0 0 3px #fff,0 2px 8px rgba(0,0,0,.2);font-size:1em;display:flex;align-items:center;justify-content:center}
.pick .dot span{font-size:2.2em}
.pick b{display:block;font-size:1.08em}
.pick small{color:var(--sub);display:block;line-height:1.35;margin-top:.15em}
.hint{font-size:.95em;color:var(--sub);margin:.7em .2em;line-height:1.5}
.opts{display:flex;gap:.6em;flex-wrap:wrap}
.opt{flex:1 1 9em;font-weight:800;font-size:1.08em;padding:.8em .6em;border-radius:1em;background:linear-gradient(135deg,#f08aa9,#c54f7b);color:#fff}
.opt.mid{flex-basis:100%;background:#fff;color:var(--sub);border:2px solid var(--line)}

/* 결과 */
.res-head{text-align:center;border-radius:1.3em;padding:1em;color:#fff;margin-bottom:.8em;position:relative;overflow:hidden}
.res-head .em{font-size:2.6em;line-height:1}
.res-head h2{margin:.1em 0;font-size:2em;letter-spacing:-.02em}
.res-head p{margin:.2em 0 0;font-weight:700;opacity:.95}
.photo{width:8.5em;height:8.5em;border-radius:50%;margin:0 auto .5em;padding:.5em;position:relative}
.photo div{width:100%;height:100%;border-radius:50%;background-size:cover;background-position:50% 32%;border:.25em solid #fff}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:.55em}
.chip{background:none;padding:0;text-align:center;font-size:.82em;font-weight:700;line-height:1.25}
.chip i{display:block;height:4em;border-radius:.9em;margin-bottom:.25em;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.14)}
.chip.sel i{outline:.25em solid var(--rose);outline-offset:.12em}
.chips.no .chip i{position:relative}
.chips.no .chip i::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(to top right,transparent 46%,rgba(255,255,255,.9) 47%,rgba(255,255,255,.9) 53%,transparent 54%)}
.note{font-size:.9em;color:var(--sub);line-height:1.6;background:#fff8e8;border-radius:1em;padding:.8em 1em;margin-bottom:.8em}
.steps4{margin:0;padding-left:1.3em;line-height:1.7;font-size:.96em}
#cdn{font-size:.85em;color:#a98a97;text-align:center;margin-top:.6em}
#vid{position:absolute;width:2px;height:2px;opacity:0;pointer-events:none;left:0;top:0}

/* 세로(태블릿) */
@media (max-aspect-ratio:1/1){
  #app{font-size:clamp(14px,2.3vw,24px)}
  #work{flex-direction:column;align-items:center;gap:.3em}
  #mirrorWrap{height:46vh;height:46dvh}
  #work.result #mirrorWrap{height:30vh;height:30dvh}
  #side{width:100%;flex:1 1 0;min-height:0}
  .how div{width:9.5em}
}
@media (max-aspect-ratio:1/1) and (max-width:520px){
  #app{font-size:13.5px}
  #top{padding:.35em .6em}#top .brand{font-size:1em}.tbtn{padding:.35em .7em;font-size:.85em}
  #mirrorWrap{height:40vh;height:40dvh;margin:.4em}
  #work.result #mirrorWrap{height:26vh;height:26dvh}
  #work{padding:0 .6em .6em}#coach .ava{width:3.2em;height:3.2em}.bubble{font-size:1.05em;padding:.6em .8em;min-height:0}
  .how div{width:100%;display:flex;align-items:center;gap:.6em;text-align:left;padding:.6em .9em}.how b{font-size:1.6em}.how i{display:inline;margin-left:.3em}
  #start h1{font-size:9vw}#goBtn{font-size:1.4em}.chips{gap:.4em}
  #mirrorWrap{height:36vh;height:36dvh}
  #side{overflow-y:auto;-webkit-overflow-scrolling:touch;gap:.5em}#pane{flex:0 0 auto;overflow:visible}
  .pick .dot{width:2.8em;height:2.8em}.pick{padding:.5em .3em}.hint{margin:.5em .2em;font-size:.9em}.opt{padding:.7em .4em}#steps span{font-size:.78em}
}
@media (max-height:520px){#coach .ava{width:3.4em;height:3.4em}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button class="tbtn" id="homeBtn">⌂ 처음으로</button>
    <div class="brand">🎨 AI 퍼스널컬러 진단실</div>
    <button class="tbtn" id="ttsBtn">🔊 음성 켜짐</button>
  </div>

  <section id="start" class="screen on">
    <h1><small>PERSONAL COLOR STUDIO</small>AI 퍼스널컬러 진단실</h1>
    <p class="lead">나에게 어울리는 색은 무엇일까요?<br>카메라를 보고 <b>컬러 선생님</b>에게 진단을 받아 보세요!</p>
    <div class="how">
      <div><b>📷</b><span>① 얼굴 비추기</span><i>거울 속 동그라미에 얼굴 맞추기</i></div>
      <div><b>🧣</b><span>② 색 천 대 보기</span><i>어느 색이 더 화사한지 고르기</i></div>
      <div><b>🌈</b><span>③ 나의 컬러 확인</span><i>어울리는 색과 꾸미기 팁</i></div>
    </div>
    <button id="goBtn">진단 시작하기</button>
    <div class="priv">🔒 사진과 영상은 저장하거나 어디로도 보내지 않아요. 이 기기 안에서만 잠깐 사용해요.</div>
    <div class="credit">연수중학교 최경수 제작</div>
  </section>

  <section id="work" class="screen">
    <div id="mirrorWrap"><canvas id="mirror" width="600" height="800"></canvas><div id="mirrorTag"></div></div>
    <div id="side">
      <div id="steps"><span>① 촬영</span><span>② AI 분석</span><span>③ 색 천 대 보기</span><span>④ 결과</span></div>
      <div id="coach">
        <div class="ava">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <circle cx="50" cy="50" r="48" fill="#ffe9ef"/>
            <path d="M22 52c0-22 12-34 28-34s28 12 28 34c0 10-3 16-6 22H28c-3-6-6-12-6-22z" fill="#5b3a29"/>
            <ellipse cx="50" cy="55" rx="21" ry="23" fill="#ffe0c8"/>
            <path d="M29 46c4-12 14-17 22-17s17 4 21 17c-8-2-14-6-18-11-5 6-14 10-25 11z" fill="#5b3a29"/>
            <ellipse cx="41" cy="56" rx="2.6" ry="3.4" fill="#3b2a33"/><ellipse cx="59" cy="56" rx="2.6" ry="3.4" fill="#3b2a33"/>
            <circle cx="35" cy="64" r="4" fill="#ffb3c0" opacity=".7"/><circle cx="65" cy="64" r="4" fill="#ffb3c0" opacity=".7"/>
            <path d="M43 66q7 6 14 0" stroke="#b84a70" stroke-width="2.4" fill="none" stroke-linecap="round"/>
            <path d="M26 30q24-22 50-2l-4 6q-22-10-44 0z" fill="#d9668a"/><circle cx="52" cy="14" r="3.5" fill="#d9668a"/>
            <path d="M30 80q20 12 40 0l8 18H22z" fill="#fff"/><path d="M44 82l6 7 6-7" stroke="#c99a5b" stroke-width="2.5" fill="none"/>
          </svg>
        </div>
        <div class="bubble"><span class="nm">컬러 선생님 ‘빛나’</span><span id="say"></span></div>
      </div>
      <div id="pane"></div>
    </div>
  </section>
</div>
<video id="vid" playsinline muted autoplay></video>

<script>
"use strict";
const $=s=>document.querySelector(s);
const vid=$('#vid'),cv=$('#mirror'),ctx=cv.getContext('2d');
const W=600,H=800,OV={x:300,y:340,rx:150,ry:200};
const sm=document.createElement('canvas');sm.width=150;sm.height=200;const sctx=sm.getContext('2d',{willReadFrequently:true});
const still=document.createElement('canvas');still.width=W;still.height=H;const stx=still.getContext('2d');
const clamp=(v,a=-1,b=1)=>Math.max(a,Math.min(b,v));

const PAGE_URL='https://cks817s-alt.github.io/personal-color/';
/* ================= 상태 ================= */
const S={state:'start',sid:0,hasCam:false,stream:null,lastAct:Date.now()};
function resetSession(){
  S.sid++;S.cam={T:0,V:0,C:0};S.votes={T:0,V:0,C:0};S.skin=null;S.hair=null;S.lab=null;S.drape=null;S.hasStill=false;
  S.hold=0;S.count=0;S.lost=0;S.force=false;S.acc=[];S.camT=0;S.msgKey='';S.round=0;S.rounds=[];S.scan=0;S.marks=0;S.autoAlt=null;
  stx.clearRect(0,0,W,H);
}
resetSession();
const later=(ms,fn)=>{const id=S.sid;setTimeout(()=>{if(id===S.sid)fn()},ms)};

/* ================= 소리 · 음성 ================= */
let AC=null;
function beep(f=880,d=.12,v=.08,type='sine',when=0){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);}catch(e){}
}
const chime=()=>{beep(784,.18,.07);beep(988,.18,.07,'sine',.12);beep(1319,.35,.07,'sine',.24)};
let ttsOn=true,voice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>/^ko/i.test(v.lang))||null}catch(e){}}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(t){
  if(!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();if(!ttsOn)return;if(!voice)pickVoice();if(!voice)return;
    const u=new SpeechSynthesisUtterance(t.replace(/<[^>]+>/g,' ').replace(/[^ -~가-힣ㄱ-ㆎ…·~]/g,' '));
    u.lang='ko-KR';u.voice=voice;u.rate=1.05;u.pitch=1.2;speechSynthesis.speak(u)}catch(e){}
}
function say(html,quiet){$('#say').innerHTML=html;if(!quiet)speak(html)}
$('#ttsBtn').onclick=()=>{ttsOn=!ttsOn;$('#ttsBtn').textContent=ttsOn?'🔊 음성 켜짐':'🔇 음성 꺼짐';if(!ttsOn&&'speechSynthesis' in window)speechSynthesis.cancel()};

/* ================= 색 계산 ================= */
function rgb2lab(r,g,b){
  const f=v=>{v/=255;return v>.04045?Math.pow((v+.055)/1.055,2.4):v/12.92};
  r=f(r);g=f(g);b=f(b);
  let x=(r*.4124+g*.3576+b*.1805)/.95047,y=r*.2126+g*.7152+b*.0722,z=(r*.0193+g*.1192+b*.9505)/1.08883;
  const k=v=>v>.008856?Math.cbrt(v):7.787*v+16/116;x=k(x);y=k(y);z=k(z);
  return{L:116*y-16,a:500*(x-y),b:200*(y-z)};
}
const hex=c=>'#'+c.map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
function isSkin(r,g,b){
  const Y=.299*r+.587*g+.114*b,Cb=128-.168736*r-.331264*g+.5*b,Cr=128+.5*r-.418688*g-.081312*b;
  return Y>35&&Cb>=77&&Cb<=130&&Cr>=133&&Cr<=178;
}
function drawVideo(g,w,h){
  const vw=vid.videoWidth,vh=vid.videoHeight;if(!vw)return false;
  const sc=Math.max(w/vw,h/vh),sw=w/sc,sh=h/sc;
  g.save();g.translate(w,0);g.scale(-1,1);g.drawImage(vid,(vw-sw)/2,(vh-sh)/2,sw,sh,0,0,w,h);g.restore();return true;
}
/* 얼굴이 타원 안에 있는지 + 피부·머리카락 색 읽기 (150x200 축소 화면에서) */
function readFace(){
  if(!drawVideo(sctx,150,200))return null;
  const d=sctx.getImageData(0,0,150,200).data;
  let n=0,sk=0,ys=0;
  for(let y=44;y<=126;y+=2)for(let x=46;x<=104;x+=2){
    const ex=(x-75)/30,ey=(y-85)/42;if(ex*ex+ey*ey>1)continue;
    const i=(y*150+x)*4,r=d[i],g=d[i+1],b=d[i+2];n++;ys+=.299*r+.587*g+.114*b;if(isSkin(r,g,b))sk++;
  }
  const px=[],all=[];
  for(const [cx,cy,rr] of [[55,97,9],[95,97,9],[75,58,9]])
    for(let y=cy-rr;y<=cy+rr;y++)for(let x=cx-rr;x<=cx+rr;x++){
      if((x-cx)**2+(y-cy)**2>rr*rr)continue;const i=(y*150+x)*4,p=[d[i],d[i+1],d[i+2]];all.push(p);if(isSkin(p[0],p[1],p[2]))px.push(p);
    }
  const lum=p=>.299*p[0]+.587*p[1]+.114*p[2];
  const avg=(arr,a,b)=>{arr.sort((p,q)=>lum(p)-lum(q));const s=arr.slice(Math.floor(arr.length*a),Math.max(Math.floor(arr.length*b),Math.floor(arr.length*a)+1));
    const m=[0,0,0];for(const p of s){m[0]+=p[0];m[1]+=p[1];m[2]+=p[2]}return m.map(v=>v/s.length)};
  const skin=avg(px.length>40?px:all,.2,.9);
  const hp=[];for(let y=22;y<=38;y++)for(let x=55;x<=95;x++){const i=(y*150+x)*4;hp.push([d[i],d[i+1],d[i+2]])}
  const hair=avg(hp,0,.6);
  return{ratio:sk/n,bright:ys/n,skin,hair};
}

/* ================= 카메라 ================= */
async function startCam(){
  try{
    S.why='';
    if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){S.why='insecure';throw 0}
    if(!(S.stream&&S.stream.active)){
      S.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});
      vid.srcObject=S.stream;
    }
    await vid.play();return true;
  }catch(e){
    if(!S.why){const n=e&&e.name||'';S.why=/NotAllowed|Security|Permission/.test(n)?'denied':/NotFound|Overconstrained|DevicesNotFound/.test(n)?'nodevice':/NotReadable|TrackStart|Abort/.test(n)?'busy':'unknown'}
    return false}
}

function goCam(){

  $('#pane').innerHTML=`<div class="card"><h3>📷 이렇게 하면 더 정확해요</h3><ul class="tips">

}
function startCount(force){if(S.count>0)return;S.force=!!force;S.count=3;S.acc=[];S.lost=0;camMsg('count');beep(880,.1)}
function camTick(dt){
  S.camT+=dt;
  if(S.camT>7&&!$('#manual').innerHTML){$('#manual').innerHTML='<button class="big ghost" id="mBtn">얼굴을 맞췄어요! 지금 찍기</button>';$('#mBtn').onclick=()=>startCount(true)}
  S.rt=(S.rt||0)+dt;if(S.rt<.12)return;S.rt=0;
  const f=readFace();if(!f)return;S.face=f;
  const okL=f.bright>55&&f.bright<228,ok=f.ratio>.38&&okL;
  if(ok)S.lastAct=Date.now();
  if(S.count>0){
    if(ok||S.force){S.acc.push(f);S.lost=0}else{S.lost+=.12;if(S.lost>.7){S.count=0;S.hold=0;S.msgKey='';camMsg('noface')}}
    return;
  }
  if(ok){S.hold+=.12;camMsg('hold');if(S.hold>=1)startCount(false)}
  else{S.hold=Math.max(0,S.hold-.24);if(S.hold===0)camMsg(f.ratio>.38?(f.bright<=55?'dark':'bright'):(f.bright<=40?'dark':'noface'))}
}
function finishCapture(){
  const acc=S.acc.length?S.acc:[S.face||readFace()].filter(Boolean);
  if(!acc.length){goCam();return}
  const m=k=>[0,1,2].map(i=>acc.reduce((s,f)=>s+f[k][i],0)/acc.length);
  S.skin=m('skin');S.hair=m('hair');
  drawVideo(stx,W,H);S.hasStill=true;
  const lab=rgb2lab(...S.skin),hl=rgb2lab(...S.hair);
  const hue=Math.atan2(lab.b,lab.a)*180/Math.PI,chroma=Math.hypot(lab.a,lab.b);
  S.lab={L:lab.L,a:lab.a,b:lab.b,hue,chroma,contrast:lab.L-hl.L};
  S.cam.T=clamp((hue-53)/10);
  S.cam.V=clamp((lab.L-64)/12);
  S.cam.C=clamp(clamp((S.lab.contrast-38)/18)*.6+clamp((chroma-24)/10)*.4);
  chime();goAnalyze();
}

const GOLD=['#b8862b','#f3d98a','#c99a3a'],SILVER=['#9aa3ad','#f1f4f7','#aab2bc'];

function decide(){
  const T=score('T'),V=score('V'),C=score('C');
  let k;
  if(T>=0)k=(V+C>=0)?(V>=C?'springLight':'springBright'):(-C>=-V?'autumnMute':'autumnDeep');
  else k=(V-C>=0)?(V>=-C?'summerLight':'summerMute'):(C>=-V?'winterBright':'winterDeep');
  return{k,T,V,C};
}

}

  const dt=Math.min(.1,(now-lastT)/1000);lastT=now;

      }else if(S.hold>0){g.strokeStyle='#55e0a0';g.lineWidth=12;g.beginPath();g.ellipse(OV.x,OV.y,OV.rx+16,OV.ry+16,0,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(1,S.hold));g.stroke()}
      g.fillStyle='#fff';g.font='800 30px sans-serif';g.textAlign='center';g.textBaseline='alphabetic';g.shadowColor='rgba(0,0,0,.6)';g.shadowBlur=8;
      g.fillText('동그라미 안에 얼굴을 맞춰 주세요',W/2,H-150);g.shadowBlur=0;
    }else if(st==='analyze'){
      S.scan+=dt;const y=(Math.sin(S.scan*2.2)*.5+.5)*(OV.ry*2)+OV.y-OV.ry;
      g.save();ovalPath(g);g.clip();const lg=g.createLinearGradient(0,y-50,0,y+6);lg.addColorStop(0,'rgba(255,120,170,0)');lg.addColorStop(1,'rgba(255,120,170,.5)');
      g.fillStyle=lg;g.fillRect(0,y-50,W,56);g.fillStyle='#fff';g.fillRect(0,y+4,W,3);g.restore();
      g.strokeStyle='rgba(255,255,255,.8)';g.lineWidth=3;g.setLineDash([8,10]);ovalPath(g);g.stroke();g.setLineDash([]);
      const mark=(x,y,r,c,l)=>{const p=1+Math.sin(S.scan*6)*.08;g.lineWidth=5;g.strokeStyle='#fff';g.beginPath();g.arc(x,y,r*p,0,7);g.stroke();
        g.fillStyle=c;g.beginPath();g.arc(x,y,r*p-4,0,7);g.fill();
        if(l){g.font='800 24px sans-serif';g.textAlign='center';g.fillStyle='#fff';g.shadowColor='rgba(0,0,0,.7)';g.shadowBlur=6;g.fillText(l,x,y-r-12);g.shadowBlur=0}};
      if(S.marks>=1){mark(220,388,26,hex(S.skin));mark(380,388,26,hex(S.skin));mark(300,232,26,hex(S.skin),'피부색')}
      if(S.marks>=2)mark(300,112,26,hex(S.hair),'머리카락색');
    }else if(st==='drape'||st==='result'){
      if(S.drape)drawDrape(S.drape);
      if(S.hasCam&&st==='drape'){g.strokeStyle='rgba(255,255,255,.4)';g.lineWidth=3;g.setLineDash([6,12]);ovalPath(g);g.stroke();g.setLineDash([])}
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ================= 자동 초기화(전시용) ================= */
addEventListener('pointerdown',()=>{S.lastAct=Date.now()},true);
addEventListener('keydown',()=>{S.lastAct=Date.now()},true);
for(const q of ['#pane','#side'])$(q).addEventListener('scroll',()=>{S.lastAct=Date.now()},{passive:true});
setInterval(()=>{
  if(S.state==='start')return;
  const lim=S.state==='result'?90:60,left=lim-(Date.now()-S.lastAct)/1000,c=$('#cdn');
  if(c)c.textContent=left<30?`${Math.max(0,Math.ceil(left))}초 뒤 처음 화면으로 돌아가요 (화면을 누르면 연장)`:'';
  if(left<=0)goStart();
},1000);
addEventListener('contextmenu',e=>e.preventDefault());

/* 시작 화면 장식 */
(()=>{const cs=['#ffcba4','#f9c6d8','#cdb9f0','#a7d3f5','#b5ead7','#ffe680','#ff8e7a','#c9a227','#e6007e','#1f3fd9'],st=$('#start');
  cs.forEach((c,i)=>{const d=document.createElement('div');d.className='float';const s=6+((i*37)%9);
    d.style.cssText=`width:${s}vmin;height:${s}vmin;background:${c};left:${(i*10.3+3)%94}%;top:${(i*23+8)%82}%;animation-delay:${-i*1.3}s`;st.prepend(d)})})();
</script>
